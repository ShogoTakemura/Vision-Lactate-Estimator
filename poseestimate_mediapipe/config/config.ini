[DEFAULT]
subject = Takemura
FPS = 30

[multiestimate]
bagfolder = E:\processing_data

[movie]
width = 720
height = 720
fps = 30.0

[correct]
fps = 30
fp = 1.8
fs = 3.0
gpass = 1
gstop = 30
threshold = 0.12
median_window = 24
savgol_window = 30
savgol_order = 5
mode = 0
;0 = with 3D movie, 1 = data correct only

[rsfilter]
thres_min = 2.1
thres_max = 3.7
dec_magni = 1
spat_magni = 2
spat_alpha = 0.50
spat_delta = 20
spat_holl = 1
temp_alpha = 0.40
temp_delta = 20
temp_holl = 4

[com]
comworkset = COM_WORKSET.csv
subjectinfopath = SUBJECTS_DATA.csv

[roi]
; 画面中心を基準とした ROI で姿勢推定範囲を限定する（複数人映り込み対策）
; enabled = true にすると ROI クロップが有効になる
enabled = false
; ROI の幅・高さ [pixel]。フレーム解像度に応じて調整すること（今回のカメラ: 640x480）
width = 380
height = 480
; フレーム中心からのオフセット [pixel]（正=右/下、負=左/上）
; 被験者が左寄りの場合は x_offset を負にしてROIを左へずらす
x_offset = -80
y_offset = 0

[floorforce]
gravity_coeff = 9.80665

[modelbasecorrect]
correctworkset = MODELBASED_WORKSET.csv
baseframe = BASEFRAMES.csv

[MOVIETOOL]
bagfiles_path = E:\processing_data
movie_out_path = C:\Users\ironm\squat_analyze\poseestimate_mediapipe\out\mp4

[FRAMETOOL]
mov_folder_path = C:\Users\ironm\squat_analyze\poseestimate_mediapipe\out\mp4