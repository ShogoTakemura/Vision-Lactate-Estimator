name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint — squat_core & tests (ruff check)
        run: ruff check squat_core/ tests/

      - name: Format check — squat_core & tests (ruff format)
        run: ruff format --check squat_core/ tests/

      - name: Unit tests (pytest, integration skipped)
        run: pytest tests/ -m "not integration" -q
